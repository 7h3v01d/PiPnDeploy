[project]
name = "pipndeploy"
version = "2.4.0"
description = "Python packaging made human — init, build, and deploy from one GUI or CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Leon Priest", email = "leonpriest76@gmail.com"}
]
dependencies = [
  "typer>=0.12",
  "tomlkit>=0.12",
]
keywords = [
  "packaging",
  "pypi",
  "deploy",
  "build",
  "gui",
  "cli",
  "python-tooling",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]

[project.optional-dependencies]
gui = [
  "PyQt6>=6.4",
]
dev = [
  "pytest>=7.0",
  "pytest-qt>=4.2",
]

[project.scripts]
pipndeploy = "PiPnDeploy.cli_main:app"

[project.gui-scripts]
pipndeploy-gui = "PiPnDeploy.gui_main:main"

[project.urls]
Homepage = "https://github.com/7h3v01d/PiPnDeploy"
Repository = "https://github.com/7h3v01d/PiPnDeploy"
Issues = "https://github.com/7h3v01d/PiPnDeploy/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Package lives at root (PiPnDeploy/ next to pyproject.toml) — no src layout
where = ["."]
include = ["PiPnDeploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
